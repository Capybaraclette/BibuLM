[package]
name = "bibulm-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Bibulm headless server CLI: serve inference on a server and manage it remotely from Bibulm Desktop over Bibulm Link"

[[bin]]
name = "bibulm"
path = "src/main.rs"

[dependencies]
bibulm-core = { path = "../core" }
bibulm-hardware = { path = "../hardware" }
bibulm-runtime = { path = "../runtime" }
bibulm-models = { path = "../models" }
bibulm-link = { path = "../link" }
bibulm-server = { path = "../server" }
tokio.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
chrono.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
