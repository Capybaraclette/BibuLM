[package]
name = "bibulm-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "BibuLM — lightweight Rust + WebView desktop app for running local LLMs with llama.cpp"

[lib]
name = "bibulm_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
bibulm-core = { path = "../crates/core" }
bibulm-hardware = { path = "../crates/hardware" }
bibulm-runtime = { path = "../crates/runtime" }
bibulm-models = { path = "../crates/models" }
bibulm-link = { path = "../crates/link" }
bibulm-server = { path = "../crates/server" }
bibulm-bench = { path = "../crates/bench" }

tauri.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-opener.workspace = true
reqwest.workspace = true
sha2.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
uuid.workspace = true
anyhow.workspace = true

[target.'cfg(windows)'.dependencies]
windows.workspace = true
